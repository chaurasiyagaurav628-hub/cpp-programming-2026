<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

    form {
        margin: auto;
        width: 600px;
        padding: 20px;
        border: 2px solid black;
        background-color: lightgray;
        border-radius: 5px;


    }

    h2 {
        font-size: 33px;
        text-align: center;
        font-family: 'AdobeClean-Bold';
    }
</style>

<body>
    <h2>Student Registration form </h2>
    <form>

        Roll no :
        <input type="text" name="" id="">
        <br><br>
        Student name :
        <input type="text" name="" id="" placeholder="First name">
        <input type="text" name="" id="" placeholder="Last name">
        <br><br>
        Father name:
        <input type="" name="" id="">
        <br><br>
        Date of birth:
        <input type="date" name="" id=""> (DD-MM-YYYY)

        <br><br>
        Mobile no:
        <input type="text" name="" id="" placeholder="+91">
        <br><br>
        Email id :
        <input type="text" name="" id="">
        <br><br>
        password :
        <input type="password" name="" id="" placeholder="">
        <br><br>
        Gender :
        <input type="radio" name="gender" id="">male
        <input type="radio" name="gender" id="">female
        <br><br>
        Department:
        <input type="checkbox" name="" id="">CSE
        <input type="checkbox" name="" id="">IT
        <input type="checkbox" name="" id="">BCE
        <input type="checkbox" name="" id="">AI
        <input type="checkbox" name="" id="">CIVIL
        <br><br>
        Course:
        <input type="text" name="" id="" placeholder="-----Select Courses------">
        <br><br>
        Student photo :
        <input type="text" name="" id="" placeholder="choose file">
        <br><br>
        Address :
        <textarea name="" id="" placeholder="Enter address"></textarea>

        <br><br>
        <button>Register</button>









    </form>

</body>

</html>
